<!doctype html>
<html lang="en">
<head>
{{> head}}
<title>Page not found · Little Worlds: Stickers</title>
<meta name="robots" content="noindex">
</head>
<body class="page">
<header class="mini">
  <a class="mini-logo" href="/" aria-label="Little Worlds: Stickers, home">
    <span class="globe">{{ui globe}}</span>
    <span class="words"><span class="word">Little Worlds</span><span class="ribbon">Stickers</span></span>

</header>
<main id="main" class="lost" data-stage>
  {{sticker playground-dog}}

  <p><a class="home-btn" href="/">Take me home</a></p>
</main>
{{> footer}}
<div id="sticker-live" class="sr-only" aria-live="polite"></div>
{{sticker-data}}
<script src="{{v /js/stickers.js}}" defer></script>
</body>
</html>
